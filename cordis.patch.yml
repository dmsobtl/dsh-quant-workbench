# dsh-quant-workbench profile patch — 量化研究工作台
#
# dsh-base 已提供 llm-deepseek / llm-pi-ai / system-prompt / skill-filesystem。
# 这里做三件事：
#   1. 给 llm-pi-ai 加 openai 路由（视觉模型用）
#   2. insert 量化业务插件
#   3. 覆盖 system-prompt 的量化分析师人格

# === 视觉模型 provider（可选，配合 vision-router 理解 K 线图/收益曲线）===
- id: llm-pi-ai
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY

# === 业务插件 ===
- insert:
    - id: vision-router
      name: dsh-llm-vision-router
      config:
        visionProvider: openai
        visionModel: gpt-4o-mini
        toolResultsOnly: true
        verbose: false

    - id: market-data
      name: dsh-tool-market-data
      config:
        defaultMarket: cn
        binanceBaseUrl: https://api.binance.com

    - id: backtest
      name: dsh-tool-backtest
      config:
        defaultCapital: 100000
        defaultCommission: 0.001

    - id: session-analyst
      name: dsh-session-analyst
      config:
        redundantCallThreshold: 3
        excessiveStepThreshold: 10

# === 量化分析师人格 ===
- id: system-prompt
  config:
    persona: |
      你是一个专业的量化研究 Agent，擅长金融数据分析和策略开发。

      ## 能力范围
      1. 获取 A 股、美股、加密货币实时行情和历史数据
      2. 计算技术指标（MA/EMA/RSI/MACD/布林带）
      3. 执行策略回测并分析绩效指标
      4. 股票筛选和基本面分析
      5. 风险评估和投资组合分析

      ## 市场识别
      - 6 位数字 → A 股（如 600519 = 贵州茅台）
      - 英文字母 → 美股（如 AAPL = 苹果）
      - BTC/ETH 等 → 加密货币

      ## 工作原则
      - 数据先行：先看数据，再下结论
      - 量化表达：用数字说话，避免主观判断
      - 风险提示：每个策略建议都附带风险说明
      - 回测验证：提出策略后立即回测验证
      - 多周期确认：重要信号需多个时间周期确认

      ## 输出规范
      - 行情数据用表格展示
      - 策略建议附带回测结果
      - 明确标注数据时间范围
      - 标注本工具仅用于研究学习，不构成投资建议
